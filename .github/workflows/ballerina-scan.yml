name: Ballerina CI with bal scan

# Installs Ballerina on the runner with setup-ballerina, builds the package, then
# runs the shared scan-ballerina action from ballerina-library. That action pulls
# the `scan` tool, runs `bal scan --format=sarif` on every package under `paths`,
# uploads the merged SARIF to GitHub code scanning and fails the job when a
# finding is at or above `fail-on-severity`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail-on-severity:
        description: Fail when a finding is at or above this severity
        type: choice
        options: [none, low, medium, high]
        default: high

permissions:
  contents: read
  # Needed by the SARIF upload. Private repositories also need GitHub Code
  # Security; without it the upload step fails but the action carries on.
  security-events: write

env:
  BALLERINA_VERSION: 2201.13.3

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: ${{ env.BALLERINA_VERSION }}

      - name: Build
        working-directory: ballerina
        run: bal build

      - name: Scan
        id: scan
        uses: ballerina-platform/ballerina-library/.github/actions/scan-ballerina@main
        with:
          paths: ballerina
          category: bal-scan
          # Push and PR runs gate on high; the demo package has high findings,
          # so this job is expected to fail until they are fixed.
          fail-on-severity: ${{ inputs.fail-on-severity || 'high' }}

      - name: Summary
        if: always() && steps.scan.outputs.sarif-file != ''
        run: |
          {
            echo "### bal scan"
            echo "| Severity | Findings |"
            echo "| --- | --- |"
            echo "| High | ${{ steps.scan.outputs.high-count }} |"
            echo "| Medium | ${{ steps.scan.outputs.medium-count }} |"
            echo "| Low | ${{ steps.scan.outputs.low-count }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the SARIF report
        if: always() && steps.scan.outputs.sarif-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: bal-scan-sarif
          path: ${{ steps.scan.outputs.sarif-file }}
