name: scan-ballerina action tests

# Runs the shared scan-ballerina action against the packages under test-cases/,
# one parallel job per case. Each job uploads its SARIF to GitHub code scanning
# under its own category and fails when the case has findings at or above its
# fail-on severity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Needed by the SARIF upload. Private repositories also need GitHub Code
  # Security; without it the upload step fails but the action carries on.
  security-events: write

env:
  BALLERINA_VERSION: 2201.13.3

jobs:
  case:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Run every case even when one of them fails.
      fail-fast: false
      matrix:
        include:
          # No findings: passes.
          - name: clean
            category: bal-scan-clean
            paths: test-cases/clean
            fail-on: low
            exclude-tests: 'true'

          # 2 high, 1 medium, 2 low: fails the high gate.
          - name: multiple issues
            category: bal-scan-multiple-issues
            paths: test-cases/multiple-issues
            fail-on: high
            exclude-tests: 'true'

          # 2 low findings, all under tests/: passes because they are dropped.
          - name: test-only issues, tests excluded
            category: bal-scan-test-only-issues-excluded
            paths: test-cases/test-only-issues
            fail-on: low
            exclude-tests: 'true'

          # Same package with the test findings kept: fails the low gate.
          - name: test-only issues, tests included
            category: bal-scan-test-only-issues-included
            paths: test-cases/test-only-issues
            fail-on: low
            exclude-tests: 'false'

          # 1 medium, 1 low, no high: fails the custom medium gate.
          - name: custom severity
            category: bal-scan-custom-severity
            paths: test-cases/custom-severity
            fail-on: medium
            exclude-tests: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: ${{ env.BALLERINA_VERSION }}

      - name: Scan
        uses: ballerina-platform/ballerina-library/.github/actions/scan-ballerina@main
        with:
          paths: ${{ matrix.paths }}
          # Code scanning keeps one run per category, so each case gets its own.
          category: ${{ matrix.category }}
          fail-on-severity: ${{ matrix.fail-on }}
          exclude-tests: ${{ matrix.exclude-tests }}
