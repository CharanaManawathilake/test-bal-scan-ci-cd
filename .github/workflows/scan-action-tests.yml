name: scan-ballerina action tests

# Runs the shared scan-ballerina action against the packages under test-cases/,
# one parallel job per case. The scan step is allowed to fail; each job then
# checks that the action passed or failed as expected, so a green job means the
# action behaved correctly, including when it was supposed to fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BALLERINA_VERSION: 2201.13.3

jobs:
  case:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Run every case even when one of them fails.
      fail-fast: false
      matrix:
        include:
          # Fails on any finding, so passing proves there are none.
          - name: zero issues passes
            paths: test-cases/clean
            fail-on: low
            exclude-tests: 'true'
            expect: success
            expect-counts: 0 0 0

          # 2 high, 1 medium, 2 low.
          - name: multiple issues fails high gate
            paths: test-cases/multiple-issues
            fail-on: high
            exclude-tests: 'true'
            expect: failure

          # 2 low findings, all under tests/. Fails on any finding, so passing
          # proves the test findings were dropped.
          - name: test-only issues pass when tests are excluded
            paths: test-cases/test-only-issues
            fail-on: low
            exclude-tests: 'true'
            expect: success
            expect-counts: 0 0 0

          # Control for the case above: the same package fails when test
          # findings are kept, so the fixture really has findings to drop.
          - name: test-only issues fail when tests are included
            paths: test-cases/test-only-issues
            fail-on: low
            exclude-tests: 'false'
            expect: failure

          # 1 medium, 1 low, no high: the default high gate would pass, the
          # custom medium gate fails.
          - name: custom severity fails medium gate
            paths: test-cases/custom-severity
            fail-on: medium
            exclude-tests: 'true'
            expect: failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: ${{ env.BALLERINA_VERSION }}

      - name: Scan
        id: scan
        continue-on-error: true
        uses: ballerina-platform/ballerina-library/.github/actions/scan-ballerina@main
        with:
          paths: ${{ matrix.paths }}
          fail-on-severity: ${{ matrix.fail-on }}
          exclude-tests: ${{ matrix.exclude-tests }}
          # Test results stay out of the Security tab.
          upload: 'false'

      - name: Check result
        env:
          EXPECT: ${{ matrix.expect }}
          OUTCOME: ${{ steps.scan.outcome }}
          EXPECT_COUNTS: ${{ matrix.expect-counts }}
          COUNTS: ${{ steps.scan.outputs.high-count }} ${{ steps.scan.outputs.medium-count }} ${{ steps.scan.outputs.low-count }}
        run: |
          echo "outcome: expected $EXPECT, got $OUTCOME"
          echo "high medium low: $COUNTS"
          STATUS=0
          if [ "$OUTCOME" != "$EXPECT" ]; then
            echo "::error::expected the scan to end in $EXPECT, got $OUTCOME"
            STATUS=1
          fi
          if [ -n "$EXPECT_COUNTS" ] && [ "$COUNTS" != "$EXPECT_COUNTS" ]; then
            echo "::error::expected high medium low counts '$EXPECT_COUNTS', got '$COUNTS'"
            STATUS=1
          fi
          exit $STATUS
