name: Test

# Runs this repository's action (uses: ./) against the packages under
# test-cases/, one parallel job per case. The scan step may fail the gate, so it
# runs with continue-on-error and a check step compares its outputs and outcome
# with what the case expects. A job fails only when the action misbehaves.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      balVersion:
        default: 2201.13.3
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read
  # Needed by the SARIF upload. Private repositories also need GitHub Code
  # Security; without it the upload step fails but the action carries on.
  security-events: write

env:
  BALLERINA_VERSION: ${{ inputs.balVersion || '2201.13.3' }}

jobs:
  test:
    name: Test action on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Run every case even when one of them fails.
      fail-fast: false
      matrix:
        # expect: result high medium low packages-scanned missing-report
        include:
          - name: clean
            paths: test-cases/clean
            fail-on: low
            expect: passed 0 0 0 1 false

          - name: multiple issues, high gate, annotations
            paths: test-cases/multiple-issues
            fail-on: high
            annotations: 'true'
            expect: failed 2 1 2 1 false

          - name: multiple issues, 2 high findings allowed
            paths: test-cases/multiple-issues
            fail-on: high
            max-findings: '2'
            expect: passed 2 1 2 1 false

          - name: multiple issues, high rules excluded with scan-args
            paths: test-cases/multiple-issues
            fail-on: high
            scan-args: --exclude-rules=ballerina:13,ballerina/os:1
            expect: passed 0 1 2 1 false

          - name: test-only issues, tests excluded
            paths: test-cases/test-only-issues
            fail-on: low
            expect: passed 0 0 0 1 false

          - name: test-only issues, tests included
            paths: test-cases/test-only-issues
            fail-on: low
            exclude-tests: 'false'
            expect: failed 0 0 2 1 false

          - name: custom severity, medium gate
            paths: test-cases/custom-severity
            fail-on: medium
            expect: failed 0 1 1 1 false

          - name: custom severity, high gate
            paths: test-cases/custom-severity
            fail-on: high
            expect: passed 0 1 1 1 false

          # Finds every package, then drops two of them by glob.
          - name: all cases, excluded paths
            paths: test-cases
            exclude-paths: |
              test-cases/multiple-issues
              test-cases/brok*
            exclude-tests: 'false'
            fail-on: none
            expect: passed 0 1 3 3 false

          - name: package that does not compile
            paths: test-cases/broken, test-cases/clean
            fail-on: none
            expect: failed 0 0 0 2 true

          - name: package that does not compile, missing report allowed
            paths: test-cases/broken
            fail-on: none
            fail-on-missing-report: 'false'
            expect: passed 0 0 0 1 true

          - name: no packages
            paths: does-not-exist
            fail-on: low
            expect: skipped 0 0 0 0 false

          # Ballerina installed by an earlier step instead of the action.
          - name: preinstalled Ballerina
            paths: test-cases/clean
            fail-on: low
            preinstalled: true
            expect: passed 0 0 0 1 false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ballerina
        if: matrix.preinstalled
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: ${{ env.BALLERINA_VERSION }}

      - name: Category
        id: category
        env:
          NAME: ${{ matrix.name }}
        # Code scanning keeps one run per category, so each case gets its own.
        run: echo "value=bal-scan-$(echo "$NAME" | tr -cs 'a-zA-Z0-9' '-' | sed 's/-*$//' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Scan
        id: scan
        continue-on-error: true
        uses: ./
        with:
          setup-ballerina: ${{ matrix.preinstalled && 'false' || 'true' }}
          ballerina-version: ${{ env.BALLERINA_VERSION }}
          paths: ${{ matrix.paths }}
          exclude-paths: ${{ matrix.exclude-paths }}
          exclude-tests: ${{ matrix.exclude-tests || 'true' }}
          scan-args: ${{ matrix.scan-args }}
          fail-on-severity: ${{ matrix.fail-on }}
          max-findings: ${{ matrix.max-findings || '0' }}
          fail-on-missing-report: ${{ matrix.fail-on-missing-report || 'true' }}
          annotations: ${{ matrix.annotations || 'false' }}
          category: ${{ steps.category.outputs.value }}

      - name: Check the result
        env:
          EXPECT: ${{ matrix.expect }}
          OUTCOME: ${{ steps.scan.outcome }}
          ACTUAL: >-
            ${{ steps.scan.outputs.result }}
            ${{ steps.scan.outputs.high-count }}
            ${{ steps.scan.outputs.medium-count }}
            ${{ steps.scan.outputs.low-count }}
            ${{ steps.scan.outputs.packages-scanned }}
            ${{ steps.scan.outputs.missing-report }}
        run: |
          echo "expected: $EXPECT"
          echo "actual:   $ACTUAL (step $OUTCOME)"
          STATUS=0
          if [ "$ACTUAL" != "$EXPECT" ]; then
            echo "::error::Expected '$EXPECT', got '$ACTUAL'"
            STATUS=1
          fi
          # The step fails exactly when the gate fails.
          WANTED=success
          [ "${EXPECT%% *}" = "failed" ] && WANTED=failure
          if [ "$OUTCOME" != "$WANTED" ]; then
            echo "::error::Expected the scan step to end in $WANTED, got $OUTCOME"
            STATUS=1
          fi
          exit $STATUS

      # Kept even when the job fails, so the findings can be inspected.
      - name: Keep the SARIF report
        if: always() && steps.scan.outputs.sarif-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ steps.category.outputs.value }}
          path: ${{ steps.scan.outputs.sarif-file }}
