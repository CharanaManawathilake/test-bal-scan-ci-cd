name: Test

# Runs this repository's action (uses: ./) against the packages under
# test-cases/, one parallel job per case. Nothing is asserted: when a case's
# gate fails, its job fails, so the error, annotations and job summary can be
# checked on the run page exactly as a user would see them. The comment above
# each case says what it should show.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      balVersion:
        default: 2201.13.3
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read
  # Needed by the SARIF upload. Private repositories also need GitHub Code
  # Security; without it the upload step fails but the action carries on.
  security-events: write
  # Needed by only-new-issues to list the files a pull request changes.
  pull-requests: read

env:
  BALLERINA_VERSION: ${{ inputs.balVersion || '2201.13.3' }}

jobs:
  test:
    name: Test action on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Run every case even when one of them fails.
      fail-fast: false
      matrix:
        # Expected: result; high/medium/low counts; packages scanned; missing report
        include:
          # passed; 0/0/0; 1 package; no missing report
          - name: clean
            paths: test-cases/clean
            fail-on: low

          # failed; 2/1/2; 1 package; no missing report; annotations shown
          - name: multiple issues, high gate, annotations
            paths: test-cases/multiple-issues
            fail-on: high
            annotations: 'true'

          # passed; 2/1/2; 1 package; no missing report
          - name: multiple issues, 2 high findings allowed
            paths: test-cases/multiple-issues
            fail-on: high
            max-findings: '2'

          # passed; 0/1/2; 1 package; no missing report
          - name: multiple issues, high rules excluded with scan-args
            paths: test-cases/multiple-issues
            fail-on: high
            scan-args: --exclude-rules=ballerina:13,ballerina/os:1

          # passed; 0/0/0; 1 package; no missing report
          - name: test-only issues, tests excluded
            paths: test-cases/test-only-issues
            fail-on: low

          # failed; 0/0/2; 1 package; no missing report
          - name: test-only issues, tests included
            paths: test-cases/test-only-issues
            fail-on: low
            exclude-tests: 'false'

          # failed; 0/1/1; 1 package; no missing report
          - name: custom severity, medium gate
            paths: test-cases/custom-severity
            fail-on: medium

          # passed; 0/1/1; 1 package; no missing report
          - name: custom severity, high gate
            paths: test-cases/custom-severity
            fail-on: high

          # Finds every package, then drops two of them by glob.
          # passed; 0/1/3; 3 packages; no missing report
          - name: all cases, excluded paths
            paths: test-cases
            exclude-paths: |
              test-cases/multiple-issues
              test-cases/brok*
            exclude-tests: 'false'
            fail-on: none

          # failed; 0/0/0; 2 packages; missing report
          - name: package that does not compile
            paths: test-cases/broken, test-cases/clean
            fail-on: none

          # passed; 0/0/0; 1 package; missing report
          - name: package that does not compile, missing report allowed
            paths: test-cases/broken
            fail-on: none
            fail-on-missing-report: 'false'

          # skipped; 0/0/0; 0 packages; no missing report
          - name: no packages
            paths: does-not-exist
            fail-on: low

          # Ballerina installed by an earlier step instead of the action.
          # passed; 0/0/0; 1 package; no missing report
          - name: preinstalled Ballerina
            paths: test-cases/clean
            fail-on: low
            preinstalled: true

          # Error: bal was not found, set setup-ballerina to true. No outputs.
          - name: setup-ballerina off without Ballerina
            paths: test-cases/clean
            fail-on: low
            setup-ballerina: 'false'

          # The log shows the latest Ballerina distribution in "Using bal scan".
          # passed; 0/0/0; 1 package; no missing report
          - name: latest Ballerina version
            paths: test-cases/clean
            fail-on: low
            ballerina-version: latest

          # The log shows "Using bal scan 0.11.0".
          # passed; 0/0/0; 1 package; no missing report
          - name: pinned tool version
            paths: test-cases/clean
            fail-on: low
            tool-version: 0.11.0

          # Newline separated paths; the repeated path is scanned once.
          # failed; 0/1/1; 2 packages; no missing report
          - name: paths on separate lines, one repeated
            paths: |
              test-cases/clean
              test-cases/custom-severity
              test-cases/clean
            fail-on: medium

          # A file glob drops the findings in main.bal but still scans the package.
          # passed; 0/0/0; 1 package; no missing report
          - name: excluded file glob
            paths: test-cases/multiple-issues
            exclude-paths: '**/main.bal'
            fail-on: low

          # Only the checkpanic rule runs.
          # failed; 0/0/1; 1 package; no missing report
          - name: multiple issues, one rule included with scan-args
            paths: test-cases/multiple-issues
            fail-on: low
            scan-args: --include-rules=ballerina:1

          # Error: scan-args cannot set --format=json. No outputs.
          - name: scan-args that set the format
            paths: test-cases/multiple-issues
            fail-on: low
            scan-args: --format=json

          # Medium and low findings count towards a low gate.
          # failed; 2/1/2; 1 package; no missing report
          - name: multiple issues, low gate
            paths: test-cases/multiple-issues
            fail-on: low

          # Error: fail-on-severity must be none, low, medium or high. No outputs.
          - name: invalid fail-on-severity
            paths: test-cases/clean
            fail-on: critical

          # On push and schedule: a notice that only-new-issues applies to pull
          # requests, then failed; 2/1/2. On a pull request that does not touch
          # test-cases/multiple-issues: passed; 0/0/0, and the log and summary say
          # 5 findings are not counted.
          - name: multiple issues, only new issues
            paths: test-cases/multiple-issues
            fail-on: high
            only-new-issues: 'true'

          # The upload-sarif step is skipped and sarif-id is empty; the SARIF artifact
          # is still kept.
          # passed; 2/1/2; 1 package; no missing report
          - name: multiple issues, upload off
            paths: test-cases/multiple-issues
            fail-on: none
            upload: 'false'

          # Fails as usual, but the job summary has no bal scan section.
          # failed; 2/1/2; 1 package; no missing report
          - name: multiple issues, job summary off
            paths: test-cases/multiple-issues
            fail-on: high
            job-summary: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ballerina
        if: matrix.preinstalled
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: ${{ env.BALLERINA_VERSION }}

      - name: Category
        id: category
        env:
          NAME: ${{ matrix.name }}
        # Code scanning keeps one run per category, so each case gets its own.
        run: echo "value=bal-scan-$(echo "$NAME" | tr -cs 'a-zA-Z0-9' '-' | sed 's/-*$//' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Scan
        id: scan
        uses: ./
        with:
          setup-ballerina: ${{ matrix.setup-ballerina || (matrix.preinstalled && 'false' || 'true') }}
          ballerina-version: ${{ matrix.ballerina-version || env.BALLERINA_VERSION }}
          tool-version: ${{ matrix.tool-version }}
          paths: ${{ matrix.paths }}
          exclude-paths: ${{ matrix.exclude-paths }}
          exclude-tests: ${{ matrix.exclude-tests || 'true' }}
          scan-args: ${{ matrix.scan-args }}
          fail-on-severity: ${{ matrix.fail-on }}
          max-findings: ${{ matrix.max-findings || '0' }}
          fail-on-missing-report: ${{ matrix.fail-on-missing-report || 'true' }}
          annotations: ${{ matrix.annotations || 'false' }}
          only-new-issues: ${{ matrix.only-new-issues || 'false' }}
          upload: ${{ matrix.upload || 'true' }}
          job-summary: ${{ matrix.job-summary || 'true' }}
          category: ${{ steps.category.outputs.value }}

      # Printed for viewing only; nothing is compared.
      - name: Show the outputs
        if: always()
        env:
          RESULT: ${{ steps.scan.outputs.result }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          MEDIUM: ${{ steps.scan.outputs.medium-count }}
          LOW: ${{ steps.scan.outputs.low-count }}
          TOTAL: ${{ steps.scan.outputs.total-count }}
          PACKAGES: ${{ steps.scan.outputs.packages-scanned }}
          MISSING: ${{ steps.scan.outputs.missing-report }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
          SARIF_ID: ${{ steps.scan.outputs.sarif-id }}
        run: |
          echo "result:           $RESULT"
          echo "high-count:       $HIGH"
          echo "medium-count:     $MEDIUM"
          echo "low-count:        $LOW"
          echo "total-count:      $TOTAL"
          echo "packages-scanned: $PACKAGES"
          echo "missing-report:   $MISSING"
          echo "sarif-file:       $SARIF_FILE"
          echo "sarif-id:         $SARIF_ID"

      # Kept when the scan fails the job, so the findings can be inspected.
      - name: Keep the SARIF report
        if: always() && steps.scan.outputs.sarif-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ steps.category.outputs.value }}
          path: ${{ steps.scan.outputs.sarif-file }}
