# GitLab CI/CD version of .github/workflows/scan-action-tests.yml, based on
# https://ballerina.io/learn/cicd/#gitlab-cicd-for-ballerina. GitLab cannot run
# the GitHub scan-ballerina action, so the job repeats its steps in shell: pull
# the tool, run bal scan, drop test findings, count findings by level and gate
# on FAIL_ON_SEVERITY. parallel:matrix runs one job per case under test-cases/;
# a job fails when its case has findings at or above FAIL_ON_SEVERITY, and the
# SARIF report is kept as an artifact either way.

stages:
  - scan

variables:
  BALLERINA_VERSION: "2201.13.3"
  # Same tool the GitHub action picks for 2201.13.2+; 0.12.0 is only on dev Central.
  SCAN_TOOL_VERSION: "0.12.0"

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y curl jq
    - curl -fsSL -o ballerina.deb https://dist.ballerina.io/downloads/$BALLERINA_VERSION/ballerina-$BALLERINA_VERSION-swan-lake-linux-x64.deb
    - dpkg -i ballerina.deb
    - bal version
    # The scan tool is not bundled with the distribution.
    - BALLERINA_DEV_CENTRAL=true bal tool pull "scan:$SCAN_TOOL_VERSION"
    - bal tool use "scan:$SCAN_TOOL_VERSION"

bal-scan:
  stage: scan
  parallel:
    matrix:
      # No findings: passes.
      - CASE: clean
        FAIL_ON_SEVERITY: low
        EXCLUDE_TESTS: "true"
      # 2 high, 1 medium, 2 low: fails the high gate.
      - CASE: multiple-issues
        FAIL_ON_SEVERITY: high
        EXCLUDE_TESTS: "true"
      # 2 low findings, all under tests/: passes because they are dropped.
      - CASE: test-only-issues
        FAIL_ON_SEVERITY: low
        EXCLUDE_TESTS: "true"
      # Same package with the test findings kept: fails the low gate.
      - CASE: test-only-issues
        FAIL_ON_SEVERITY: low
        EXCLUDE_TESTS: "false"
      # 1 medium, 1 low, no high: fails the custom medium gate.
      - CASE: custom-severity
        FAIL_ON_SEVERITY: medium
        EXCLUDE_TESTS: "true"
  script:
    - cd "test-cases/$CASE"
    # A failed scan shows up as a missing report below.
    - bal scan --format=sarif || true
    - SARIF=target/report/scan_results.sarif
    - test -f "$SARIF" || { echo "bal scan did not produce $SARIF"; exit 1; }
    - |
      if [ "$EXCLUDE_TESTS" = "true" ]; then
        jq '.runs[].results |= map(select(
              (.locations[0].physicalLocation.artifactLocation.uri // "") | test("^(modules/[^/]+/)?tests/") | not))' \
          "$SARIF" > target/report/scan_results_filtered.sarif
        SARIF=target/report/scan_results_filtered.sarif
      fi
    # bal scan levels: error = high, warning = medium, note = low.
    - |
      count() { jq --arg l "$1" '[.runs[0].results[] | select(.level == $l)] | length' "$SARIF"; }
      HIGH=$(count error); MEDIUM=$(count warning); LOW=$(count note)
      echo "bal scan '$CASE': $HIGH high, $MEDIUM medium, $LOW low severity finding(s)"
      case "$FAIL_ON_SEVERITY" in
        none) FAILING=0 ;;
        high) FAILING=$HIGH ;;
        medium) FAILING=$((HIGH + MEDIUM)) ;;
        low) FAILING=$((HIGH + MEDIUM + LOW)) ;;
        *) echo "FAIL_ON_SEVERITY must be none, low, medium or high"; exit 1 ;;
      esac
      if [ "$FAILING" -gt 0 ]; then
        echo "ERROR: bal scan found $FAILING finding(s) at or above $FAIL_ON_SEVERITY severity"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - test-cases/$CASE/target/report/*.sarif
